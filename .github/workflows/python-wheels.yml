name: Python wheels

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            compatibility: "2_28"
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            compatibility: "2_28"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            compatibility: pypi
          - os: macos-15
            target: aarch64-apple-darwin
            compatibility: pypi
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            compatibility: pypi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.target }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wheel-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'pyproject.toml') }}
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: "1.15.0"
          target: ${{ matrix.target }}
          rust-toolchain: "1.88.0"
          manylinux: ${{ matrix.compatibility }}
          args: --release --locked --out dist
      - name: Install and exercise wheel
        shell: bash
        run: |
          python -m pip install --no-index --no-deps dist/*.whl
          python scripts/smoke-python-wheel.py
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
